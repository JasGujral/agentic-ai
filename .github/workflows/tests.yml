name: Tests

# develop is where work lands; article-** snapshots are what readers clone; main is the published
# consolidation. All three must be green. See the branch rule in CLAUDE.md.
on:
  push:
    branches: [develop, main, 'article-**']
  pull_request:
    branches: [develop, main, 'article-**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/ -v
